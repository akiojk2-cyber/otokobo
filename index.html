<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>OTO KOBO おと工房</title>
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-90Qf+dqbn/UK2IGaTSPP7BkbB8ww1IpKpX5my6oMfeU='; style-src 'unsafe-inline'; img-src data: blob:; media-src blob:; connect-src 'none'; font-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; worker-src 'none'; manifest-src 'none'">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#47291a}
body{font-family:'Hiragino Maru Gothic ProN','Hiragino Maru Gothic Pro','Arial Rounded MT Bold','Yu Gothic UI','Meiryo',system-ui,sans-serif;color:#fbf1df;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
button{font-family:inherit;border:0;cursor:pointer;color:inherit;padding:0;background:none}
button:focus-visible{outline:3px solid #fbf1df;outline-offset:3px}
.walnut{background-color:#47291a;background-image:radial-gradient(ellipse 60% 40% at 25% 30%,rgba(255,190,130,.10),transparent 70%),radial-gradient(ellipse 50% 30% at 80% 75%,rgba(0,0,0,.25),transparent 70%),repeating-linear-gradient(91deg,rgba(0,0,0,0) 0 11px,rgba(0,0,0,.16) 11px 13px,rgba(255,220,180,.04) 13px 26px,rgba(0,0,0,.08) 26px 27px),repeating-linear-gradient(89deg,rgba(0,0,0,.07) 0 2px,transparent 2px 7px)}
.maple{background-color:#e3c08d;background-image:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0) 40%,rgba(80,40,10,.08)),repeating-linear-gradient(96deg,rgba(130,75,30,.10) 0 2px,transparent 2px 6px,rgba(130,75,30,.06) 6px 7px,transparent 7px 15px);box-shadow:inset 0 -6px 0 rgba(110,60,20,.35),inset 0 2px 0 rgba(255,255,255,.55),0 7px 14px rgba(0,0,0,.45);color:#3b2312}
.brass{background:linear-gradient(160deg,#f0d38a,#c49a3e 45%,#8f6a22 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 -2px 0 rgba(0,0,0,.25),0 4px 10px rgba(0,0,0,.4);color:#3a220f}
.hand{font-family:'Klee','Klee One','Hiragino Maru Gothic ProN',sans-serif;font-weight:600}
.press{transition:transform .08s}
.press:active{transform:translateY(3px)}

#app{position:fixed;inset:0;display:flex;flex-direction:column;padding:max(16px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left));gap:14px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-shrink:0}
.logo{display:flex;flex-direction:column;line-height:1;padding:8px 14px;border-radius:12px}
.logo b{font-family:'Arial Rounded MT Bold','Hiragino Maru Gothic ProN',sans-serif;font-size:20px;letter-spacing:2px}
.logo small{font-size:10px;font-weight:700;margin-top:3px;letter-spacing:3px}
nav{display:flex;align-items:center;gap:8px}
.step{display:flex;align-items:center;gap:8px;white-space:nowrap;height:50px;padding:0 16px 0 7px;border-radius:25px;background:rgba(0,0,0,.28);color:#e8d3b0;box-shadow:inset 0 2px 4px rgba(0,0,0,.4);font-size:18px;font-weight:800}
.step .n{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Arial Rounded MT Bold','Hiragino Maru Gothic ProN',sans-serif;font-size:19px;background:rgba(255,255,255,.1)}
.step.on{background:linear-gradient(160deg,#f6dc95,#d6ad4e 50%,#a77d2c);color:#3a220f;box-shadow:0 0 0 3px #fbf1df,0 0 26px rgba(255,210,110,.6)}
.step.on .n{background:#3a220f;color:#f6dc95}
.arrow{color:#c49a3e;flex-shrink:0}
.globe{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
main{flex:1;min-height:0;position:relative}
.screen{position:absolute;inset:0;display:none}
.screen.on{display:flex}
.tag{display:inline-block;padding:3px 13px;border-radius:8px;font-size:14px;font-weight:800;letter-spacing:2px}
.muted-text{color:#e8d3b0;font-size:14px}

/* REC */
#s-rec{gap:36px}
.mic-col{flex:0 0 38%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px}
.mic-wrap{position:relative;width:min(36vh,330px);aspect-ratio:1;display:flex;align-items:center;justify-content:center}
.ring{position:absolute;border-radius:50%;border:4px solid rgba(255,90,74,.3);transition:transform .06s}
.mic{position:relative;width:64%;aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;touch-action:none}
.mic .core{width:84%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 40% 35%,#ff7a62,#e2412c 70%);display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:inset 0 -10px 0 rgba(120,20,0,.3),0 0 40px rgba(255,90,74,.5);transition:transform .1s}
.mic.rec .core{transform:scale(.94);box-shadow:inset 0 -6px 0 rgba(120,20,0,.3),0 0 70px 10px rgba(255,90,74,.9)}
.mic-label{font-size:24px;font-weight:800;letter-spacing:2px;text-align:center}
.side{flex:1;min-width:0;display:flex;flex-direction:column;gap:18px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;overflow-y:auto;padding:12px 6px 10px;margin:-6px -6px 0;max-height:44vh}
.card{position:relative;height:96px;border-radius:20px;display:flex;align-items:center;gap:14px;padding:0 16px;text-align:left}
.card.sel{box-shadow:inset 0 -6px 0 rgba(110,60,20,.35),inset 0 2px 0 rgba(255,255,255,.55),0 0 0 4px var(--c),0 0 26px var(--c)}
.badge{flex-shrink:0;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:inset 0 -4px 0 rgba(0,0,0,.2)}
.card .badge{width:52px;height:52px}
.card .nm{font-size:22px;line-height:1;color:#3b2312}
.wave{display:flex;align-items:center;gap:2px;height:30px;margin-top:6px}
.wave i{display:block;width:4px;border-radius:2px;background:rgba(70,38,14,.75)}
.card .x{position:absolute;top:-8px;right:-6px;width:30px;height:30px;border-radius:50%;background:#3b2312;color:#f6dc95;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.5)}
.empty-card{grid-column:1/-1;height:96px;border-radius:20px;border:3px dashed rgba(251,241,223,.3);display:flex;align-items:center;justify-content:center;color:#e8d3b0;font-size:16px}
.drawer{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;padding:12px 14px;border-radius:18px;background:rgba(0,0,0,.25);box-shadow:inset 0 3px 8px rgba(0,0,0,.45)}
.preset{height:78px;min-width:0;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:800}
.preset .badge{width:42px;height:42px}
.preset.sel{box-shadow:inset 0 -6px 0 rgba(110,60,20,.35),0 0 0 4px var(--c),0 0 20px var(--c)}
.go{display:flex;align-items:center;gap:12px;height:70px;padding:0 14px 0 28px;border-radius:35px;font-size:22px;font-weight:800;align-self:flex-end;margin-top:auto}
.go .badge{width:48px;height:48px}

/* PLAY */
#s-play{gap:28px}
.play-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px}
.play-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:10px;height:56px;padding:0 18px 0 7px;border-radius:28px;font-size:22px}
.chip .badge{width:42px;height:42px}
.beats{display:flex;gap:20px}
.beats span{display:flex;gap:10px;padding:6px 8px;border-radius:16px;background:rgba(0,0,0,.22)}
.beats i{width:20px;height:20px;border-radius:50%;background:#2b190d;box-shadow:0 0 0 4px #8f6a22,inset 0 2px 3px rgba(0,0,0,.6);transition:background .05s}
.beats i.on{background:#ffc531;box-shadow:0 0 0 4px #c49a3e,0 0 18px #ffc531}
.listen{display:flex;align-items:center;gap:8px;padding:0 16px;height:42px;border-radius:21px;background:rgba(0,0,0,.28);box-shadow:inset 0 2px 4px rgba(0,0,0,.4);font-size:15px;font-weight:700}
.listen i{width:12px;height:12px;border-radius:50%;background:#ff5a4a;box-shadow:0 0 0 4px rgba(255,90,74,.25),0 0 12px #ff5a4a;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.35}}
.pads{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;gap:1.6%;touch-action:none}
.bar{position:relative;width:9%;height:calc(100% - var(--k) * 46%);border-radius:16px;touch-action:none;background-color:var(--wood);background-image:linear-gradient(90deg,rgba(255,255,255,.26),rgba(255,255,255,0) 35%,rgba(0,0,0,.18)),repeating-linear-gradient(2deg,rgba(0,0,0,.14) 0 2px,transparent 2px 9px,rgba(0,0,0,.07) 9px 10px,transparent 10px 21px);box-shadow:inset 0 -6px 0 rgba(0,0,0,.3),inset 0 2px 0 rgba(255,255,255,.45),0 10px 16px rgba(0,0,0,.5);transition:transform .07s,box-shadow .15s,filter .15s}
.bar::before,.bar::after{content:'';position:absolute;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fbe7b0,#a77d2c 70%);box-shadow:0 1px 2px rgba(0,0,0,.6)}
.bar::before{top:16%}.bar::after{bottom:16%}
.pads.drums{flex-wrap:wrap;align-content:center;gap:2% 3%}
.head{position:relative;width:var(--d);aspect-ratio:1;border-radius:50%;touch-action:none;--rim:clamp(6px,1.3vw,14px);background:radial-gradient(circle at 42% 38%,#fffaf0,#f3e3c3 55%,#dcc59c);box-shadow:inset 0 0 0 var(--rim) var(--c),inset 0 0 0 calc(var(--rim) + 2px) rgba(0,0,0,.18),0 12px 20px rgba(0,0,0,.55);transition:transform .07s,box-shadow .15s}
.head.cym{--rim:4px;background:repeating-radial-gradient(circle,rgba(255,255,255,.18) 0 2px,rgba(0,0,0,0) 2px 7px),radial-gradient(circle at 40% 35%,#f6dc95,#c49a3e 55%,#8f6a22)}
.hit{transform:translateY(4px) scale(.97)!important;filter:brightness(1.35) saturate(1.2);box-shadow:0 0 0 4px #fbf1df,0 0 44px 14px var(--glow)!important}
.play-side{flex:0 0 27%;display:flex;flex-direction:column;align-items:center;gap:12px;min-width:0}
.star{width:min(22vh,170px);aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.star .core{width:84%;aspect-ratio:1;border-radius:50%;background:#ffc531;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 -8px 0 rgba(160,90,0,.35),0 0 40px rgba(255,197,49,.55)}
.star .core svg{width:60%;height:60%}
.star.pop .core{animation:pop .45s}
.star.count .core{background:#fbf1df;animation:breathe .6s infinite alternate}
.star.rec .core{background:radial-gradient(circle at 40% 35%,#ff7a62,#e2412c 70%);box-shadow:inset 0 -8px 0 rgba(120,20,0,.3),0 0 50px rgba(255,90,74,.8)}
@keyframes breathe{to{transform:scale(.94)}}
.pads-wrap{position:relative;flex:1;min-height:0;display:flex}
.pads-wrap .pads{flex:1}
.cnum{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;font-family:'Arial Rounded MT Bold','Hiragino Maru Gothic ProN',sans-serif;font-size:min(34vh,240px);font-weight:800;color:#ffd25e;text-shadow:0 6px 0 #8f6a22,0 0 40px rgba(255,197,49,.8);opacity:0}
.cnum.on{animation:countpop .5s ease-out forwards}
@keyframes countpop{0%{opacity:0;transform:scale(1.6)}35%{opacity:1;transform:scale(.95)}100%{opacity:.85;transform:scale(1)}}
.recbar{position:absolute;left:0;right:0;top:-6px;height:14px;border-radius:7px;background:rgba(0,0,0,.35);box-shadow:inset 0 2px 4px rgba(0,0,0,.6);overflow:hidden;opacity:0;transition:opacity .15s;pointer-events:none}
.recbar.on{opacity:1}
.recbar i{display:block;height:100%;width:0;border-radius:7px;background:linear-gradient(90deg,#ff7a62,#e2412c);box-shadow:0 0 12px rgba(255,90,74,.8)}
.recbar .dot{position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1px;background:rgba(251,241,223,.5);z-index:1}
@keyframes pop{30%{transform:scale(1.18) rotate(-8deg)}}
.star-label{font-size:18px;font-weight:800;text-align:center}
.tempo{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:24px;background:rgba(0,0,0,.25);box-shadow:inset 0 3px 8px rgba(0,0,0,.45);width:100%;flex-shrink:0}
.tbtn{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tmid{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:7px}
.tval{display:flex;align-items:center;gap:8px;font-size:22px;line-height:1;font-family:'Arial Rounded MT Bold','Hiragino Maru Gothic ProN',sans-serif}
.tlamp{width:16px;height:16px;border-radius:50%;background:#2b190d;box-shadow:0 0 0 3px #8f6a22}
.tlamp.hit{background:#ffc531;box-shadow:0 0 0 3px #c49a3e,0 0 16px #ffc531}
.tempo.idle .tlamp{animation:tpulse var(--beat,.6s) infinite}
@keyframes tpulse{0%,22%{background:#ffc531;box-shadow:0 0 0 3px #c49a3e,0 0 16px #ffc531}23%,100%{background:#2b190d;box-shadow:0 0 0 3px #8f6a22}}
.tmid input.tslider{display:block;width:100%;height:14px;background:linear-gradient(90deg,#4fa83a,#ffc531 50%,#ff6b4a)}
.transport .tempo{width:300px;flex:0 0 300px}
.rack{width:100%;flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:18px;background:rgba(0,0,0,.25);box-shadow:inset 0 3px 8px rgba(0,0,0,.45)}
.mini{display:flex;align-items:center;gap:8px;height:56px;padding:0 10px 0 8px;border-radius:10px;background:var(--c);box-shadow:inset 0 -4px 0 rgba(0,0,0,.2),0 5px 10px rgba(0,0,0,.45);flex-shrink:0}
.mini.new{animation:drop .6s cubic-bezier(.3,1.5,.5,1)}
@keyframes drop{0%{transform:translateY(-60px) rotate(-8deg);opacity:0}100%{transform:none;opacity:1}}
.label{flex:1;min-width:0;display:flex;align-items:center;gap:8px;padding:0 10px;transform:rotate(-1deg);background:#f6ecd2;background-image:repeating-linear-gradient(0deg,rgba(150,110,60,.08) 0 1px,transparent 1px 4px);clip-path:polygon(2% 0,98% 0,100% 18%,98% 34%,100% 50%,98% 66%,100% 82%,98% 100%,2% 100%,0 82%,2% 66%,0 50%,2% 34%,0 18%);color:#3b2312}
.mini .label{height:42px;font-size:16px}
.num{flex-shrink:0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Arial Rounded MT Bold','Hiragino Maru Gothic ProN',sans-serif;font-weight:700;background:linear-gradient(160deg,#f0d38a,#c49a3e 50%,#8f6a22);color:#3a220f}
.mini .num{width:24px;height:24px;font-size:14px}
.reels{flex-shrink:0;width:50px;height:22px;border-radius:11px;background:#2b190d;display:flex;align-items:center;justify-content:space-around}
.reels i{width:13px;height:13px;border-radius:50%;border:3px solid #fbf1df}
.playing .reels i{border-style:dashed;animation:spin 1.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rack-empty{margin:auto;text-align:center;color:#e8d3b0;font-size:15px;line-height:1.6;padding:8px}
.go.wide{width:100%;justify-content:space-between;align-self:stretch;font-size:20px;height:64px}

/* SONG */
#s-song{flex-direction:column;gap:14px}
.deck{position:relative;flex:1;min-height:0;border-radius:22px;padding:18px 22px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;background-color:#2e1a0e;background-image:repeating-linear-gradient(91deg,rgba(0,0,0,0) 0 9px,rgba(0,0,0,.2) 9px 11px,rgba(255,220,180,.03) 11px 22px);box-shadow:inset 0 4px 14px rgba(0,0,0,.6),0 0 0 6px #6b4024,0 0 0 8px #3a220f}
.lane{display:flex;align-items:center;gap:16px;min-height:92px;flex:1;max-height:120px;transition:opacity .2s,filter .2s}
.lane.mute{opacity:.45;filter:saturate(.4)}
.tape{position:relative;flex:0 0 27%;height:88px;border-radius:14px;display:flex;align-items:center;gap:8px;padding:0 10px 0 9px;background:var(--c);box-shadow:inset 0 -6px 0 rgba(0,0,0,.22),inset 0 2px 0 rgba(255,255,255,.3),0 8px 14px rgba(0,0,0,.5)}
.tape .label{height:72px;flex-direction:row}
.tape .num{width:30px;height:30px;font-size:17px}
.tape .nm{font-size:20px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tape .wave{height:24px;margin-top:5px}
.tape .wave i{width:3px;background:var(--c)}
.tape .x{position:absolute;top:-9px;left:-9px;width:30px;height:30px;border-radius:50%;background:#3b2312;color:#f6dc95;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.5)}
.grid{position:relative;flex:1;min-width:0;height:76px;border-radius:14px;background:rgba(0,0,0,.35);box-shadow:inset 0 3px 8px rgba(0,0,0,.6);padding:9px 10px;display:grid;grid-template-columns:repeat(16,minmax(0,1fr));gap:4px;align-items:center}
.cell{height:40%;border-radius:6px;background:rgba(255,255,255,.07);touch-action:manipulation}
.cell.q{background:rgba(255,255,255,.13)}
.cell.b2{margin-left:10px}
.cell.f{height:100%;background:var(--c);box-shadow:inset 0 -4px 0 rgba(0,0,0,.22),inset 0 2px 0 rgba(255,255,255,.35)}
.cell.f.now{background:#fff;box-shadow:0 0 0 3px var(--c),0 0 20px 6px var(--c)}
.cell.now:not(.f){background:rgba(255,231,160,.35)}
.ctl{flex:0 0 auto;display:flex;align-items:center;gap:10px}
.mute-btn{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center}
input[type=range]{-webkit-appearance:none;appearance:none;width:90px;height:16px;border-radius:8px;background:#1a0e06;box-shadow:inset 0 2px 4px rgba(0,0,0,.7);touch-action:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:34px;border-radius:6px;background:linear-gradient(160deg,#f0d38a,#c49a3e 45%,#8f6a22);box-shadow:0 3px 6px rgba(0,0,0,.5)}
input[type=range]::-moz-range-thumb{width:22px;height:34px;border:0;border-radius:6px;background:linear-gradient(160deg,#f0d38a,#c49a3e 45%,#8f6a22)}
.deck-empty{margin:auto;text-align:center;color:#e8d3b0;font-size:20px;line-height:1.7}
.transport{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-shrink:0}
.side-btn{white-space:nowrap;display:flex;align-items:center;gap:10px;height:62px;padding:0 22px 0 9px;border-radius:31px;font-size:19px;font-weight:800}
.side-btn .badge{width:44px;height:44px}
.seno{display:flex;align-items:center;gap:14px;height:92px;padding:0 38px 0 10px;border-radius:46px;font-size:32px;font-weight:800;letter-spacing:3px}
.seno .disc{width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;background:radial-gradient(circle at 40% 35%,#ff7a62,#e2412c 70%);box-shadow:inset 0 -6px 0 rgba(0,0,0,.25),0 0 26px rgba(255,90,74,.6)}
.seno.on .disc{background:#3b2312;box-shadow:inset 0 -6px 0 rgba(0,0,0,.25)}
.seno:disabled{opacity:.5}

.mic.count .core{background:radial-gradient(circle at 40% 35%,#fffaf0,#f3e3c3 70%);color:#e2412c;box-shadow:inset 0 -10px 0 rgba(120,80,30,.25),0 0 40px rgba(255,210,110,.6)}
.mic.rec .core{animation:recpulse .9s infinite alternate}
.mic.count .core svg{opacity:0}
@keyframes recpulse{to{box-shadow:inset 0 -6px 0 rgba(120,20,0,.3),0 0 80px 18px rgba(255,90,74,.95)}}
.mic-num{font-size:min(20vh,170px);color:#e2412c;text-shadow:0 5px 0 #8f2a1a,0 0 30px rgba(255,255,255,.6)}
.meter{display:flex;gap:4px;padding:8px 10px;border-radius:14px;background:rgba(0,0,0,.3);box-shadow:inset 0 2px 6px rgba(0,0,0,.6);opacity:.45;transition:opacity .2s}
.meter.live{opacity:1}
.meter i{width:14px;height:22px;border-radius:4px;background:rgba(255,255,255,.08)}
.meter i.on{background:#5fae2e;box-shadow:0 0 8px rgba(95,174,46,.8)}
.meter i:nth-child(n+10).on{background:#ffc531;box-shadow:0 0 8px rgba(255,197,49,.8)}
.meter i:nth-child(n+13).on{background:#e2412c;box-shadow:0 0 8px rgba(226,65,44,.9)}

      '<button class="step press' + (S.screen === st[0] ? ' on' : '') + '" data-go="' + st[0] + '"' + (S.screen === st[0] ? ' aria-current="step"' : '') + '><span class="n">' + (i + 1) + '</span>' + svg(st[1], 24) + '<span>' + esc(t(st[0])) + '</span></button>';
  }).join('');
  $('langBtn').setAttribute('aria-label', t('langTitle') + ': ' + t('lang'));
  $('helpBtn').setAttribute('aria-label', t('help'));
  document.documentElement.lang = lang;
}

function renderRec() {
  $('s-rec').innerHTML =
    '<div class="mic-col">' +
      '<div class="mic-wrap"><div class="ring" id="ring1" style="inset:0"></div><div class="ring" id="ring2" style="inset:12%"></div>' +
      '<button class="mic brass" id="micBtn" aria-label="' + esc(t('hold')) + '"><div class="core">' + svg('mic', 96, 3.2) + '</div></button><div class="cnum mic-num" id="micCount" aria-live="assertive"></div></div>' +
      '<div class="meter" id="meter" aria-hidden="true">' + new Array(15).join('<i></i>') + '</div>' +
      '<div style="text-align:center"><div class="mic-label" id="micLabel">' + esc(t('hold')) + '</div><div class="muted-text" style="margin-top:4px">' + esc(t('holdSub')) + '</div></div>' +
    '</div>' +
    '<div class="side">' +
      '<div><span class="tag brass">' + esc(t('mine')) + '</span></div>' +
      '<div class="cards" id="cards"></div>' +
      '<div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap"><span class="tag brass">' + esc(t('drawer')) + '</span><span class="muted-text">' + esc(t('drawerSub')) + '</span></div>' +
      '<div class="drawer" id="drawer"></div>' +
      '<button class="go maple press" data-go="play"><span>' + esc(t('playThis')) + '</span><div class="badge" id="goBadge" style="background:#1fa3a3">' + svg('arrow', 26, 5) + '</div></button>' +
    '</div>';
  var mic = $('micBtn');
  mic.addEventListener('pointerdown', micTap);
  micState = ''; updateMicUI(true);
  mic.addEventListener('contextmenu', function (ev) { ev.preventDefault(); });
  renderRecCards(false); renderDrawer();
}
function renderRecCards(recording) {
  var el = $('cards'); if (!el) return;
  var html = '';
  if (recording) html += '<div class="card maple sel" style="--c:#e2412c"><div class="badge" style="background:#e2412c">' + svg('mic', 28) + '</div><div><div class="nm hand">' + esc(t('recording')) + '</div><div class="wave" id="liveWave" aria-hidden="true"></div></div></div>';
  if (!S.recs.length && !recording) html += '<div class="empty-card">' + esc(t('mineEmpty')) + '</div>';
  html += S.recs.map(function (s) {
    return '<button class="card maple press' + (S.sel === s.id ? ' sel' : '') + '" style="--c:' + s.color + '" data-pick="' + s.id + '">' + badge(s, 28) +
      '<div style="min-width:0"><div class="nm hand">' + esc(soundName(s)) + '</div>' + waveHTML(s.peaks, 20) + '</div>' +
      '<span class="x" role="button" aria-label="' + esc(t('del')) + '" data-del="' + s.id + '">' + svg('x', 16, 5) + '</span></button>';
  }).join('');
  el.innerHTML = html;
  updateGoBadge();
}
function renderDrawer() {
  var el = $('drawer'); if (!el) return;
  el.innerHTML = PRESETS.map(function (p) {
    return '<button class="preset maple press' + (S.sel === p.id ? ' sel' : '') + '" style="--c:' + p.color + '" data-pick="' + p.id + '" aria-label="' + esc(soundName(p)) + '">' + badge(p, 24) + '<span>' + esc(soundName(p)) + '</span></button>';
  }).join('');
  updateGoBadge();
}
function updateGoBadge() { var s = soundById(S.sel), b = $('goBadge'); if (s && b) b.style.background = s.color; }

function renderPlay() {
  var s = soundById(S.sel) || PRESETS[0];
  var pads = '';
  if (s.drum) {
    var D = [[30, 'kick', '#c94a2c'], [21, '', '#d9553a'], [18, '', '#ff7b5c'], [20, '', '#ff6b4a'], [17, '', '#ff8a6c'], [15, 'cym', '#ff8a6c'], [17, 'cym', '#ff7b5c'], [21, 'cym', '#ff8a6c']];
    pads = '<div class="pads drums" id="pads">' + D.map(function (d, i) {
      return '<button class="head' + (d[1] === 'cym' ? ' cym' : '') + '" data-pad="' + i + '" aria-label="' + esc(soundName(s)) + ' ' + (i + 1) + '" style="--d:' + d[0] + '%;--c:' + d[2] + ';--glow:' + s.color + '"></button>';
    }).join('') + '</div>';
  } else {
    var base = hexToRgb(s.color);
    pads = '<div class="pads" id="pads">' + PENTA.map(function (_, i) {
      var k = i / 7;
      var wood = 'rgb(' + base.map(function (v) { return Math.round(v * (0.62 + k * 0.5) + 30 * k); }).map(function (v) { return Math.min(255, v); }).join(',') + ')';
      return '<button class="bar" data-pad="' + i + '" aria-label="' + esc(soundName(s)) + ' ' + (i + 1) + '" style="--k:' + k.toFixed(3) + ';--wood:' + wood + ';--glow:' + s.color + '"></button>';
    }).join('') + '</div>';
  }
  $('s-play').innerHTML =
    '<div class="play-main">' +
      '<div class="play-top">' +
        '<button class="chip maple press" data-go="rec" aria-label="' + esc(t('back')) + '" style="box-shadow:inset 0 -6px 0 rgba(110,60,20,.35),0 0 0 4px ' + s.color + ',0 7px 14px rgba(0,0,0,.45)">' + badge(s, 24) + '<span class="hand">' + esc(soundName(s)) + '</span></button>' +
        '<div style="display:flex;align-items:center;gap:16px"><div class="beats" id="beats" aria-hidden="true"><span><i></i><i></i><i></i><i></i></span><span><i></i><i></i><i></i><i></i></span></div></div>' +
      '</div><div class="pads-wrap">' + pads + '<div class="cnum" id="countEl" aria-live="assertive"></div><div class="recbar" id="recBar"><span class="dot"></span><i id="recFill"></i></div></div>' +
    '</div>' +
    '<div class="play-side">' + tempoHTML() +
      '<button class="star brass press" id="starBtn" aria-label="' + esc(t('keep')) + '"><div class="core">' + STAR_SVG + '</div></button>' +
      '<div class="star-label" id="starLabel">' + esc(t('keep')) + '</div>' +
      '<div class="rack" id="rack"></div>' +
      '<button class="go wide maple press" data-go="song"><span>' + esc(t('toSong')) + '</span><div class="badge" style="background:#3b2312;color:#f6dc95">' + svg('arrow', 24, 5) + '</div></button>' +
    '</div>';
  var padsEl = $('pads');
  padsEl.addEventListener('pointerdown', function (ev) {
    var b = ev.target.closest('[data-pad]'); if (!b) return;
    ev.preventDefault();
    try { b.releasePointerCapture(ev.pointerId); } catch (err) {}
    hitPad(+b.getAttribute('data-pad'), b);
  });
  padsEl.addEventListener('contextmenu', function (ev) { ev.preventDefault(); });
  $('starBtn').addEventListener('click', starPress);
  starState = ''; updateStarUI(true);
  renderRack();
}
function hexToRgb(h) { h = h.replace('#', ''); return [parseInt(h.substr(0, 2), 16), parseInt(h.substr(2, 2), 16), parseInt(h.substr(4, 2), 16)]; }
function renderRack() {
  var el = $('rack'); if (!el) return;
  if (!S.tracks.length) { el.innerHTML = '<div class="rack-empty">' + nl(t('rackEmpty')) + '</div>'; return; }
  el.innerHTML = S.tracks.slice().reverse().map(function (tr) {
    var s = soundById(tr.soundId);
    return '<div class="mini' + (S.newTrack === tr.id ? ' new' : '') + '" style="--c:' + s.color + '"><div class="label"><span class="num">' + tr.n + '</span><span class="hand" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(soundName(s)) + '</span></div><div class="reels"><i></i><i></i></div></div>';
  }).join('');
  S.newTrack = null;
}

function renderSong() {
  var lanes = S.tracks.map(function (tr) {
    var s = soundById(tr.soundId);
    var cells = tr.pattern.map(function (p, i) { return '<div class="cell' + (p.length ? ' f' : '') + (i % 2 === 0 ? ' q' : '') + (i === 8 ? ' b2' : '') + '" data-cell="' + tr.id + ':' + i + '"></div>'; }).join('');
    return '<div class="lane' + (tr.muted ? ' mute' : '') + '" id="lane-' + tr.id + '" style="--c:' + s.color + '">' +
      '<div class="tape"><span class="x" role="button" tabindex="0" aria-label="' + esc(t('del')) + '" data-deltrack="' + tr.id + '">' + svg('x', 16, 5) + '</span>' +
        '<div class="label"><span class="num">' + tr.n + '</span><div style="min-width:0"><div class="nm hand">' + esc(soundName(s)) + '</div>' + waveHTML(s.peaks, 14) + '</div></div>' +
        '<div class="badge" style="width:40px;height:40px;background:rgba(0,0,0,.25)">' + svg(s.icon, 22) + '</div></div>' +
      '<div class="ctl-row" style="display:flex;align-items:center;gap:12px;flex:1;min-width:0">' +
        '<div class="grid" data-grid="' + tr.id + '">' + cells + '</div>' +
        '<div class="ctl"><button class="mute-btn maple press" data-mute="' + tr.id + '" aria-label="' + esc(tr.muted ? t('muteOff') : t('muteOn')) + '" aria-pressed="' + tr.muted + '">' + svg(tr.muted ? 'spkOff' : 'spk', 26, 4) + '</button>' +
        '<input type="range" min="0" max="1" step="0.01" value="' + tr.vol + '" data-vol="' + tr.id + '" aria-label="' + esc(t('vol')) + '"></div>' +
      '</div></div>';
  }).join('');
  $('s-song').innerHTML =
    '<div class="deck" id="deck">' + (lanes || '<div class="deck-empty">' + nl(t('deckEmpty')) + '</div>') + '</div>' +
    '<div class="transport">' +
      '<button class="side-btn maple press" data-go="rec"><div class="badge" style="background:#e2412c">' + svg('plus', 24, 5) + '</div>' + esc(t('addRec')) + '</button>' +
      '<button class="seno brass press' + (S.songPlaying ? ' on' : '') + '" id="senoBtn"' + (S.tracks.length ? '' : ' disabled') + '><div class="disc">' + (S.songPlaying ? STOP_SVG : PLAY_SVG) + '</div><span>' + esc(S.songPlaying ? t('stop') : t('seno')) + '</span></button>' + tempoHTML() +
      '<button class="side-btn maple press" id="saveBtn"><div class="badge" style="background:#3b2312;color:#f6dc95">' + svg('down', 24, 4.5) + '</div>' + esc(t('save')) + '</button>' +
    '</div>';
  $('senoBtn').addEventListener('click', toggleSong);
  $('saveBtn').addEventListener('click', function () { saveSong().catch(function (err) { console.error(err); toast('error'); }); });
  var deck = $('deck');
  deck.addEventListener('input', function (ev) {
    var id = ev.target.getAttribute('data-vol'); if (!id) return;
    var tr = trackById(id); if (!tr || !ctx) return;
    var v = +ev.target.value; tr.vol = (v >= 0 && v <= 1) ? v : 0.8;
    if (!tr.muted) tr.gain.gain.setTargetAtTime(tr.vol, ctx.currentTime, 0.02);
  });
  deck.classList.toggle('playing', S.songPlaying);
  deck.classList.toggle('many', S.tracks.length > 6);
}
function trackById(id) { for (var i = 0; i < S.tracks.length; i++) if (S.tracks[i].id === id) return S.tracks[i]; return null; }
function toggleSong() {
  if (!S.tracks.length) return;
  if (S.songPlaying) { stopTransport(); S.songPlaying = false; }
  else { stopTransport(); startTransport(false); S.songPlaying = true; }
  renderSong();
}

function go(screen) {
  if (S.screen === 'rec' && screen !== 'rec') releaseMic();
  cancelTake();
  S.screen = screen;
  stopTransport(); S.songPlaying = false;
  if (screen === 'play') startTransport(true);
  renderAll();
}
function renderAll() {
  renderNav();
  ['rec', 'play', 'song'].forEach(function (k) { $('s-' + k).classList.toggle('on', S.screen === k); $('s-' + k).innerHTML = ''; });
  if (S.screen === 'rec') renderRec();
  if (S.screen === 'play') renderPlay();
  if (S.screen === 'song') renderSong();
}

/* ---------- global events ---------- */
document.addEventListener('pointerdown', function () { ensureAudio(); }, { capture: true });
document.addEventListener('click', function (ev) {
  var el = ev.target.closest('[data-go],[data-pick],[data-del],[data-mute],[data-deltrack],[data-cell],[data-tempo]');
  if (!el) return;
  if (el.hasAttribute('data-tempo')) { setTempo(S.bpm + (+el.getAttribute('data-tempo') || 0)); return; }
  if (el.hasAttribute('data-del')) {
    ev.stopPropagation();
    var id = el.getAttribute('data-del');
    if (S.tracks.some(function (tr) { return tr.soundId === id; })) S.tracks = S.tracks.filter(function (tr) { return tr.soundId !== id; });
    S.recs = S.recs.filter(function (s) { return s.id !== id; });
    if (S.sel === id) S.sel = S.recs.length ? S.recs[0].id : 'p-drum';
    renderRecCards(false); renderDrawer();
    return;
  }
  if (el.hasAttribute('data-go')) { go(el.getAttribute('data-go')); return; }
  if (el.hasAttribute('data-pick')) {
    var pick = el.getAttribute('data-pick');
    if (!soundById(pick) || !ensureAudio()) return;
    S.sel = pick; voice(ctx, soundById(S.sel), 3, ctx.currentTime + 0.01, liveBus);
    renderRecCards(false); renderDrawer();
    return;
  }
  if (el.hasAttribute('data-mute')) {
    var tr = trackById(el.getAttribute('data-mute'));
    if (!tr || !ensureAudio()) return;
    tr.muted = !tr.muted;
    tr.gain.gain.setTargetAtTime(tr.muted ? 0 : tr.vol, ctx.currentTime, 0.02);
    renderSong(); return;
  }
  if (el.hasAttribute('data-deltrack')) {
    var tid = el.getAttribute('data-deltrack'), tr2 = trackById(tid);
    if (tr2) tr2.gain.disconnect();
    S.tracks = S.tracks.filter(function (x) { return x.id !== tid; });
    if (!S.tracks.length) { stopTransport(); S.songPlaying = false; }
    renderSong(); return;
  }
  if (el.hasAttribute('data-cell')) {
    var parts = el.getAttribute('data-cell').split(':'), tr3 = trackById(parts[0]), i = +parts[1];
    if (!tr3 || !(i >= 0 && i < NSTEP) || !ensureAudio()) return;
    var snd = soundById(tr3.soundId);
    if (tr3.pattern[i].length) tr3.pattern[i] = [];
    else { tr3.pattern[i] = [snd.drum ? 0 : 3]; ensureAudio(); voice(ctx, snd, tr3.pattern[i][0], ctx.currentTime, tr3.gain); }
    el.classList.toggle('f', tr3.pattern[i].length > 0);
    return;
  }
});
document.addEventListener('input', function (ev) { if (ev.target.hasAttribute && ev.target.hasAttribute('data-bpm')) setTempo(+ev.target.value || 100); });
function openSheet(html) { $('sheet').innerHTML = html; $('overlay').hidden = false; var b = $('sheet').querySelector('button'); if (b) b.focus(); }
function closeSheet() { $('overlay').hidden = true; $('sheet').innerHTML = ''; }
function showHelp() {
  var items = (HELP[lang] || HELP.en)[S.screen] || [];
  openSheet('<h2 id="sheetTitle">' + svg('help', 30, 4.5) + '<span>' + esc(t('help')) + ' ・ ' + esc(t(S.screen)) + '</span></h2><ol class="guide">' +
    items.map(function (it, i) { return '<li><span class="gnum">' + (i + 1) + '</span><span class="gicon">' + svg(it[0], 30, it[0] === 'star' || it[0] === 'play' ? 3 : 3.6) + '</span><span class="gtext">' + esc(it[1]) + '</span></li>'; }).join('') +
    '</ol><button class="sheet-ok brass press" data-close="1">' + esc(t('ok')) + '</button>');
}
function showLang() {
  openSheet('<h2 id="sheetTitle"><span>' + esc(t('langTitle')) + '</span></h2><div class="langs">' +
    LANGS.map(function (l) { return '<button class="lang-btn ' + (l === lang ? 'brass' : 'maple') + ' press" data-lang="' + l + '"' + (l === lang ? ' aria-current="true"' : '') + '>' + esc(T[l].lang) + '</button>'; }).join('') + '</div>');
}
$('helpBtn').addEventListener('click', showHelp);
$('langBtn').addEventListener('click', showLang);
$('overlay').addEventListener('click', function (ev) {
  var lb = ev.target.closest('[data-lang]');
  if (lb) { var l = lb.getAttribute('data-lang'); if (LANGS.indexOf(l) >= 0) { lang = l; closeSheet(); renderAll(); } return; }
  if (ev.target.id === 'overlay' || ev.target.closest('[data-close]')) closeSheet();
});
document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && !$('overlay').hidden) closeSheet(); });
window.addEventListener('pagehide', releaseMic);
document.addEventListener('visibilitychange', function () { if (document.hidden) { releaseMic(); cancelTake(); stopTransport(); S.songPlaying = false; if (S.screen === 'song') renderSong(); } else if (S.screen === 'play') startTransport(true); });

/* ---------- animation loop ---------- */
var lastStep = -2;
function frame() {
  if (S.screen === 'rec') {
    updateMicUI(false);
    var mt = $('meter');
    if (mt) {
      var pk = R.an ? readLevel() : 0;
      R.mlev = Math.max(pk, (R.mlev || 0) * 0.86);
      var db = R.mlev > 0 ? 20 * Math.log(R.mlev) / Math.LN10 : -99;
      var lit = Math.max(0, Math.min(14, Math.round((db + 48) / 48 * 14)));
      if (mt._lit !== lit) { mt._lit = lit; for (var m = 0; m < mt.children.length; m++) mt.children[m].classList.toggle('on', m < lit); }
      mt.classList.toggle('live', !!R.an);
    }
  }
  if (S.screen === 'rec' && R.on) {
    R.level = R.level * 0.6 + readLevel() * 0.4;
    var lv = Math.min(1, R.level * 2.2);
    var r1 = $('ring1'), r2 = $('ring2');
    if (r1) r1.style.transform = 'scale(' + (1 + lv * 0.12) + ')';
    if (r2) r2.style.transform = 'scale(' + (1 + lv * 0.08) + ')';
    var lw = $('liveWave');
    if (lw && lw.childNodes.length < 20 && performance.now() - (lw._t || 0) > 120) { lw._t = performance.now(); var i = document.createElement('i'); i.style.height = Math.round(4 + lv * 24) + 'px'; i.style.background = '#e2412c'; lw.appendChild(i); }
  }
  if (S.screen === 'play') updateStarUI(false);
  var st = curStep();
  var idle = (T0 === null), tps = document.querySelectorAll('.tempo');
  for (var q = 0; q < tps.length; q++) tps[q].classList.toggle('idle', idle);
  if (st !== lastStep) {
    lastStep = st;
    if (st >= 0 && st % 2 === 0) {
      var lamps = document.querySelectorAll('.tlamp');
      for (var L = 0; L < lamps.length; L++) { (function (el) { el.classList.add('hit'); clearTimeout(el._t); el._t = setTimeout(function () { el.classList.remove('hit'); }, 110); })(lamps[L]); }
    }
    if (S.screen === 'play') {
      var bs = document.querySelectorAll('#beats i'), beat = st < 0 ? -1 : Math.floor(st / 2) % 8;
      for (var b = 0; b < bs.length; b++) bs[b].classList.toggle('on', b === beat);
    }
    if (S.screen === 'song') {
      var olds = document.querySelectorAll('.cell.now'); for (var k = 0; k < olds.length; k++) olds[k].classList.remove('now');
      if (st >= 0 && S.songPlaying) S.tracks.forEach(function (tr) { var g = document.querySelector('[data-grid="' + tr.id + '"]'); if (g && g.children[st]) g.children[st].classList.add('now'); });
    }
  }
  requestAnimationFrame(frame);
}

/* ---------- debug hooks (used by tests) ---------- */
// Exposed only for local testing (file://) or with #debug, never by default on the public site.
if (location.protocol === 'file:' || location.hash === '#debug') {
  DBG.state = S; DBG.go = go; DBG.hitPad = hitPad; DBG.starPress = starPress; DBG.addTrack = addTrack; DBG.renderAll = function () { renderAll(); }; Object.defineProperty(DBG, 'take', { get: function () { return take; } }); DBG.curStep = curStep; DBG.saveSong = saveSong;
  Object.defineProperty(DBG, 'T0', { get: function () { return T0; } });
  Object.defineProperty(DBG, 'master', { get: function () { return master; } });
  DBG.LOOP = LOOP; DBG.STEP = STEP;
  window.__okDebug = DBG;
}

renderAll();
requestAnimationFrame(frame);
})();
</script>
